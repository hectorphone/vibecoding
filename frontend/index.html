<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <script src="js/app.js" defer></script>
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <header class="mb-4">
        <h1 class="h2">Gestor de tareas</h1>
        <p class="text-secondary mb-0">Crea y consulta tus tareas.</p>
      </header>

      <section class="row g-3 mb-4" aria-label="Resumen de tareas">
        <div class="col-12 col-md-4">
          <article class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 card-title text-secondary">Total de tareas</h2>
              <p id="tasks-total" class="display-6 mb-0" aria-live="polite">0</p>
            </div>
          </article>
        </div>
        <div class="col-12 col-md-4">
          <article class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 card-title text-success">Completadas</h2>
              <p id="tasks-completed" class="display-6 mb-0" aria-live="polite">0</p>
            </div>
          </article>
        </div>
        <div class="col-12 col-md-4">
          <article class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 card-title text-secondary">No completadas</h2>
              <p id="tasks-pending" class="display-6 mb-0" aria-live="polite">0</p>
            </div>
          </article>
        </div>
      </section>

      <section class="card shadow-sm mb-4" aria-labelledby="form-heading">
        <div class="card-body">
          <h2 id="form-heading" class="h5 card-title">Nueva tarea</h2>
          <form id="task-form">
            <div class="mb-3">
              <label for="task-title" class="form-label">Título</label>
              <input
                id="task-title"
                name="title"
                class="form-control"
                type="text"
                maxlength="200"
                required
              >
            </div>
            <div class="mb-3">
              <label for="task-description" class="form-label">Descripción</label>
              <textarea
                id="task-description"
                name="description"
                class="form-control"
                rows="3"
                maxlength="2000"
              ></textarea>
            </div>
            <button id="submit-task" class="btn btn-primary" type="submit">
              Añadir tarea
            </button>
            <div id="task-actions" class="d-none mt-3">
              <button id="update-task" class="btn btn-primary" type="button">
                Guardar cambios
              </button>
              <button id="complete-task" class="btn btn-success" type="button">
                Marcar como completada
              </button>
              <button id="delete-task" class="btn btn-danger" type="button">
                Borrar tarea
              </button>
              <button id="cancel-edit" class="btn btn-outline-secondary" type="button">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </section>

      <div id="status-message" class="alert d-none" role="status" aria-live="polite"></div>

      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="h4 mb-3">Tareas</h2>
        <div id="task-list" class="d-grid gap-3" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
